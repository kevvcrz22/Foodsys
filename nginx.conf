# Configuración de Nginx para Foodsys en Hetzner Cloud
# Copiar o enlazar a: /etc/nginx/sites-available/foodsys.conf
# Luego crear symlink: ln -s /etc/nginx/sites-available/foodsys.conf /etc/nginx/sites-enabled/

# Redirección de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name foodsyslagranja.com www.foodsyslagranja.com;

    # Permitir validación de Let's Encrypt por HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloque HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foodsyslagranja.com www.foodsyslagranja.com;

    # Certificados SSL Let's Encrypt (Certbot los gestionará automáticamente)
    ssl_certificate /etc/letsencrypt/live/foodsyslagranja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodsyslagranja.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad y Cabeceras
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Límite de subida (para importaciones masivas de aprendices por Excel)
    client_max_body_size 25M;

    # Compresión Gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Frontend SPA (Archivos estáticos generados por Vite)
    root /var/www/foodsys/Frontend/dist;
    index index.html;

    # Manejo de rutas del SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estática para assets de Vite
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. API Backend (Node / Express en puerto 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # 3. Socket.IO (WebSockets para notificaciones y turnos en tiempo real)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Archivos subidos (imágenes de platos, menús)
    location /uploads/ {
        alias /var/www/foodsys/Node/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
